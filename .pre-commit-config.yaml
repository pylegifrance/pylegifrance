default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uvx ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy pylegifrance
        language: system
        types: [python]
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright pylegifrance tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-cov
        name: pytest (with 90% coverage floor)
        entry: uv run pytest tests/unit tests/test_config.py tests/test_client.py --cov=pylegifrance --cov-report=term-missing
        language: system
        types: [python]
        pass_filenames: false
